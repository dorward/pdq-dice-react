services:
  pdq-frontend:
    container_name: pdq-frontend
    profiles: ["production"]
    build:
      context: ./client/
      dockerfile: ".Dockerfile.${ENVIRONMENT}"
    volumes:
      - "./client/:/app"
      - "/app/node_modules"
    ports:
      - 5100:5100
    environment:
      - CHOKIDAR_USEPOLLING=true
      - ENVIRONMENT
      - API_URL
      - FRONTEND_URL
    depends_on:
      - pdq-api
    restart: unless-stopped
  pdq-api:
    container_name: pdq-api
    profiles: ["production", "development"]
    build:
      context: ./server/
      dockerfile: .Dockerfile
      target: "${ENVIRONMENT:-production}"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      API_URL: "${API_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:newPassword@postgres:5432/pdq}"
      NODE_ENV: "${ENVIRONMENT:-production}"
      AVATAR_PATH: "${AVATAR_PATH}"
      AVATAR_URL: "${AVATAR_URL}"
      TOKEN: "${TOKEN}"
      PORT: 5101
    ports:
      - "5101:5101"
    volumes:
      - ./static:/var/pdq/static:ro
      - ~/.pdq/avatars:/var/pdq/avatars
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  postgres:
    container_name: postgres18
    profiles: ["production", "development"]
    image: "${POSTGRES_IMAGE:-postgres:18.6-alpine}"
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-5102}"
    volumes:
      - "${POSTGRES_DATA_DIR:-${HOME}/.pdq/postgres18}:/var/lib/postgresql"
      - ./server/src/migrations/dbinit.sql:/docker-entrypoint-initdb.d/docker_postgres_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdq"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newPassword
      POSTGRES_DB: pdq
  migrator:
    container_name: migrator
    profiles: ["production", "development"]
    image: "${POSTGRES_IMAGE:-postgres:18.6-alpine}"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:newPassword@postgres:5432/pdq}"
    volumes:
      - ./server/src/migrations/:/migrations/:ro
    command: sh /migrations/update.sh
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  db-data:
  pgadmin-data:
